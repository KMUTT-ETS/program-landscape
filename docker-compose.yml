name: program-landscape

services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: program-landscape-postgres:dev
    container_name: program-landscape-postgres
    restart: unless-stopped
    # Postgres' parallel-query workers map hash-join state into /dev/shm.
    # The 64 MB Docker default blows up on parallel fan-outs that JOIN
    # class_offering_teachers (214k) × class_offerings (122k). Bump to
    # 1 GB — covers a 5-way parallel page-load with comfortable margin.
    shm_size: 1g
    # max_connections — 100 (Postgres default) is too tight for this
    # stack: each of {api, ingestion, web-Next-dev} runs a Prisma client
    # with a per-process pool of ~17. Add ad-hoc tsx probes and the
    # ingestion worker firing 4-5 connectors in parallel at boot, and
    # the pool saturates ("too many clients already"). 300 gives ~15×
    # headroom and is well within Postgres' comfort zone for dev RAM.
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kku_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-program_landscape}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kku} -d ${POSTGRES_DB:-program_landscape}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: program-landscape-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: program-landscape-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Custom Gotenberg image with TH Sarabun New embedded system-wide. The
  # upstream image renders Thai as tofu boxes (□□□) — see
  # infra/gotenberg/README.md. Rebuild with `docker compose build gotenberg`
  # after changing the Dockerfile or dropping new fonts into
  # infra/gotenberg/fonts/.
  gotenberg:
    build:
      context: ./infra/gotenberg
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: program-landscape-gotenberg:dev
    container_name: program-landscape-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-timeout=60s"
      - "--log-level=info"
      # Keep web security on; we never render untrusted HTML. The only
      # fetches the templates make are to same-origin asset URLs.
      - "--chromium-disable-web-security=false"
    ports:
      - "${GOTENBERG_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  minio-data:
