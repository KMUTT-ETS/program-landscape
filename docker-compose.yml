name: program-landscape

services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: program-landscape-postgres:dev
    container_name: program-landscape-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kku_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-program_landscape}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kku} -d ${POSTGRES_DB:-program_landscape}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: program-landscape-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: program-landscape-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: Default upstream Gotenberg image. Prompt 02c replaces this with a
  # custom image that embeds TH Sarabun New (Thailand's Cabinet-mandated font).
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: program-landscape-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-web-security=true"
    ports:
      - "3001:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
