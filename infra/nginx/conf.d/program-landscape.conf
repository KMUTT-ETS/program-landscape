# Virtual-host for program-landscape.kku.ac.th. TLS terminates twice:
# first at the KKU reverse proxy (publicly-trusted cert), then here
# (self-signed cert the KKU proxy accepts via proxy_ssl_verify off).

upstream web_upstream { server web:3000; keepalive 32; }
upstream api_upstream { server api:4000; keepalive 32; }

# HTTP :8080 — if anything reaches us on plain HTTP, bounce to HTTPS.
server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 8443 ssl default_server;
  listen [::]:8443 ssl default_server;
  http2 on;
  server_name program-landscape.kku.ac.th _;

  # Self-signed cert (10-year lifetime) — generated on the prod server
  # by scripts/generate-self-signed-cert.sh and mounted from
  # /opt/program-landscape/certs.
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         'ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!EXPORT';
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  # OCSP stapling is meaningless for a self-signed cert — skip.

  # Security headers. App layers (Next.js middleware + NestJS helmet)
  # already set these for their own responses; nginx sets them as a
  # defence-in-depth for error pages + static assets served directly.
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Long-running AI / PDF requests — Gemini extractions are ~5-20s; PDF
  # generation via Gotenberg can take ~30s on big templates.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # ── Health check ───────────────────────────────────────────────────
  # Unauthenticated; KKU proxy polls this to gate upstream traffic.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # ── API routes ─────────────────────────────────────────────────────
  # /api/* and /api/v1/* both route here — the Next.js internal /api/auth
  # handlers live under /api/auth and MUST go to the web service, not the
  # NestJS api. We differentiate:
  #   /api/auth/*  → web
  #   /api/*       → api (NestJS global prefix is /api/v1)
  # The api service's NEXTAUTH_SECRET/JWT decode is invoked via
  # Authorization header, so next-auth's /api/auth/* never crosses to it.

  location /api/auth/ {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
  }

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_request_buffering off;   # stream large PDF uploads
  }

  # ── Next.js static assets ─────────────────────────────────────────
  # Long-lived caching. Next fingerprints these under /_next/static.
  location /_next/static/ {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Everything else → web.
  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
  }
}
