# Virtual-host for program-landscape.kku.ac.th. TLS terminates twice:
# first at the KKU reverse proxy (publicly-trusted cert), then here
# (self-signed cert the KKU proxy accepts via proxy_ssl_verify off
# OR SHA-256 fingerprint pinning).

upstream web_upstream { server web:3000; keepalive 32; }
upstream api_upstream { server api:4000; keepalive 32; }

# ── HTTP :8080 — bounce to HTTPS ─────────────────────────────────────
# Anything that arrives on plain HTTP (the KKU proxy mis-sending,
# operator typo) gets a permanent redirect. No content, no body.
server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  # 308 preserves request method (POST stays POST). Use 301 for the
  # rare GET-only flows the spec mentions; both are fine for our case
  # but 308 is more correct for an API surface. Keep it conservative
  # at 301 since HTTP→HTTPS is the canonical permanent redirect.
  return 301 https://$host$request_uri;
}

# ── HTTPS :8443 — main server ───────────────────────────────────────
server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  http2 on;
  server_name program-landscape.kku.ac.th 10.101.118.80;

  # ── Cert ──────────────────────────────────────────────────────────
  # Self-signed (10-year lifetime) — generated on the prod server by
  # scripts/generate-self-signed-cert.sh and mounted from
  # /opt/program-landscape/certs.
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # ── TLS profile (Mozilla intermediate, 2024 update) ───────────────
  # TLSv1.2 + TLSv1.3 only. TLSv1.0/1.1 disabled. The cipher suite
  # tracks Mozilla's "intermediate" profile: forward-secrecy ECDHE,
  # AEAD-only (GCM / ChaCha20-Poly1305).
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;  # honour client preference under TLS 1.3

  # TLSv1.3 ciphers (always AEAD; just lists the order)
  ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
  # TLSv1.2 ciphers — Mozilla intermediate.
  ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  # OCSP stapling is meaningless for a self-signed cert — skip.

  # ── Security headers ──────────────────────────────────────────────
  # App layers (Next.js middleware + NestJS helmet) already set most of
  # these for their own responses; nginx sets them as defence-in-depth
  # for error pages + static assets it serves directly. `always`
  # ensures they're emitted on 4xx / 5xx responses too.
  #
  # Note: we don't set `Content-Security-Policy` here. The Next.js
  # middleware emits a per-request nonce-based CSP for HTML responses,
  # which is the only correct place for it (CSP needs to be per-doc,
  # nginx serves none of the HTML directly). API responses don't need
  # a CSP — they're JSON.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # ── Long-running upstream requests ────────────────────────────────
  # Gemini extractions are ~5-20s; PDF generation via Gotenberg can
  # take ~30s on big templates.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # ── Health check ──────────────────────────────────────────────────
  # Unauthenticated; KKU proxy polls this to gate upstream traffic.
  # NEVER rate-limited (an over-zealous probe must never put us in
  # back-off and break the gate).
  #
  # We deliberately don't use `add_header Content-Type ...` here —
  # that would replace the inherited security headers (nginx's
  # add_header inheritance rule: an inner block with any add_header
  # replaces the entire outer set). `default_type text/plain` sets
  # the content-type without touching the header chain.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ── Routing policy ────────────────────────────────────────────────
  # NestJS is mounted at /api/v1/ (see apps/api/src/main.ts
  # `setGlobalPrefix('api/v1')`). Everything else under /api/* is a
  # Next.js route handler living in apps/web/app/api/*.
  #
  # Rules below, in nginx-match order:
  #   1. /api/auth/  → web (next-auth, strict auth_zone limit)
  #   2. /api/v1/<heavy paths> → api (heavy_zone, PDF exports)
  #   3. /api/v1/    → api (everything else NestJS)
  #   4. /api/       → web (covers /api/admin-*, /api/me/, /api/proxy/,
  #                    /api/profile/, /api/profile-narrative, etc.
  #                    — any future Next handler under /api/* "just works")
  #   5. /           → web (pages)
  #
  # Earlier nginx configs routed /api/ → api by default and then added
  # individual exceptions per Next handler. That whack-a-mole pattern
  # bit us four times (v1.0.9 admin/registry, v1.0.9 share-card,
  # v1.0.10 admin-education refresh). Inverting the default ends it.

  # ── Auth surface — strict per-IP limit ────────────────────────────
  # /api/auth/* hits NextAuth's signin / signout / csrf endpoints +
  # our custom KKU SSO callback. 10 r/s with burst=20 covers normal
  # use; credential-stuffing attempts trip 429.
  location /api/auth/ {
    limit_req zone=auth_zone burst=20 nodelay;
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Request-Id $req_id;
  }

  # ── Heavy: Council Pack + PDF export ──────────────────────────────
  # PDF-export endpoints are intentionally bursty (a Council session
  # exports ~10 packs in a few seconds). 1 r/s sustained, burst=10 lets
  # the burst through without queueing.
  location ~ ^/api/v1/(?:cockpit/export|programs/[^/]+/export-detail-pdf|pdf/generate) {
    limit_req zone=heavy_zone burst=10 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Request-Id $req_id;
    proxy_request_buffering off;   # stream large PDF uploads
  }

  # ── NestJS API ────────────────────────────────────────────────────
  # Everything under /api/v1/ is a NestJS controller. Generic
  # per-IP limit covers the bulk of the analytical traffic.
  location /api/v1/ {
    limit_req zone=api_zone burst=50 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Request-Id $req_id;
  }

  # ── Next.js /api/* route handlers (catch-all) ─────────────────────
  # Anything under /api/* NOT matched by the rules above is a Next
  # route handler living in apps/web/app/api/*. Same rate limit as
  # the NestJS catch-all because most are proxy routes hitting NestJS
  # behind the scenes anyway.
  location /api/ {
    limit_req zone=api_zone burst=50 nodelay;
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Request-Id $req_id;
    proxy_request_buffering off;   # stream large PDF uploads
  }

  # ── Next.js static assets ─────────────────────────────────────────
  # Long-lived caching. Next fingerprints these under /_next/static.
  # NOT rate-limited — the browser blasts dozens of fingerprinted
  # static files per page load, all 304-able.
  location /_next/static/ {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ── Everything else → web ────────────────────────────────────────
  location / {
    limit_req zone=api_zone burst=50 nodelay;
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Request-Id $req_id;
  }
}
