# Program Landscape — internal nginx.
#
# Request path:
#   User → program-landscape.kku.ac.th (KKU reverse proxy, public TLS)
#        → https://<our-host>:8443   (self-signed TLS, this server)
#        → web:3000 / api:4000       (HTTP inside the docker network)
#
# The KKU proxy is configured with `proxy_ssl_verify off` (or SHA-256
# cert pinning — stronger) so it accepts our self-signed cert. The only
# traffic this server ever serves is on :8443 (HTTPS).

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile         on;
  tcp_nopush       on;
  tcp_nodelay      on;
  keepalive_timeout 65;

  # Upload size: must accommodate large มคอ.2 PDFs (~50 MB) plus a
  # small multipart overhead. Matches the intake service's 50 MB cap.
  client_max_body_size 100M;

  # ── Logging ─────────────────────────────────────────────────────────
  # $http_x_forwarded_for is preserved from the KKU proxy so audit logs
  # show the real client IP, not our proxy.
  log_format main  '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'xff="$http_x_forwarded_for" xfp="$http_x_forwarded_proto" '
                   'req_time=$request_time upstream_time=$upstream_response_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Real IP restoration ─────────────────────────────────────────────
  # Trust X-Forwarded-For ONLY from the KKU reverse proxy. Replace the
  # placeholder CIDRs below with the real KKU proxy source IPs before
  # go-live (confirm with KKU network team + document in
  # docs/deployment/kku-network-integration.md).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header   X-Forwarded-For;
  real_ip_recursive on;

  # Prefer a modern compression default. Gzip is enough; brotli
  # requires the `libnginx-mod-brotli` package which we skip to keep
  # the image vanilla.
  gzip                on;
  gzip_vary           on;
  gzip_min_length     1024;
  gzip_proxied        any;
  gzip_comp_level     5;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml
    application/x-font-ttf
    font/opentype;

  include /etc/nginx/conf.d/*.conf;
}
