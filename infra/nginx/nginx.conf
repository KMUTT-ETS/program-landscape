# Program Landscape — internal nginx (post-prompt-08 hardening).
#
# Request path:
#   User → program-landscape.kku.ac.th (KKU reverse proxy, public TLS)
#        → https://10.101.118.80:8443  (self-signed TLS, this server)
#        → web:3000 / api:4000          (HTTP inside the docker network)
#
# The KKU proxy is configured with `proxy_ssl_verify off` (or SHA-256
# cert pinning — stronger; cert fingerprint at /opt/program-landscape/
# certs/fingerprint.txt). The only traffic this server ever serves is
# on :8443 (HTTPS) + a 301 from :8080.

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile         on;
  tcp_nopush       on;
  tcp_nodelay      on;
  keepalive_timeout 65;

  # ── Header buffer + client-body limits ─────────────────────────────
  # Ceiling for any upload — sized to: largest expected PDF (50 MB) +
  # multipart overhead. Anything above returns 413. Avatars (4 MB) and
  # course-spec PDFs are well below.
  client_max_body_size 60M;
  client_body_timeout  30s;
  client_header_timeout 10s;
  send_timeout         60s;

  # ── Request ID ──────────────────────────────────────────────────────
  # Take an upstream-supplied X-Request-Id when present; mint nginx's
  # built-in $request_id (32-hex random per request) otherwise. The
  # resolved value is exposed as $req_id and threaded into both the
  # access log AND the upstream X-Request-Id header so api / web /
  # ingestion log lines chain back to the same request.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # ── Logging ─────────────────────────────────────────────────────────
  # $http_x_forwarded_for is preserved from the KKU proxy so audit logs
  # show the real client IP, not our proxy. The `real_ip_*` block below
  # rewrites $remote_addr too. `req_id` is the load-bearing field for
  # the cross-tier trace — every log line in api / web / ingestion
  # carries the same value (NestJS pino's genReqId prefers the header).
  log_format main  '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'xff="$http_x_forwarded_for" xfp="$http_x_forwarded_proto" '
                   'req_id="$req_id" '
                   'req_time=$request_time upstream_time=$upstream_response_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Real-IP restoration ─────────────────────────────────────────────
  # Trust X-Forwarded-For ONLY from the KKU reverse proxy. Replace the
  # placeholder CIDRs below with the real KKU proxy source IPs before
  # go-live (confirm with KKU network team — see
  # docs/deployment/kku-network-integration.md §6).
  #
  # The current placeholders are RFC-1918 ranges (KKU's whole LAN), which
  # is too broad — any KKU LAN host could spoof X-Forwarded-For. Before
  # Phase 2 of rollout, narrow to the KKU upstream proxy's exact CIDR.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header   X-Forwarded-For;
  real_ip_recursive on;

  # ── Rate-limit zones (per-IP, after real_ip rewrite) ───────────────
  # Two strict zones:
  #   - auth_zone:  10 req/s sustained, burst 20 — hits /api/auth/* and
  #                 /api/v1/users (login + provisioning paths). A burst
  #                 above 30 in 1s likely indicates credential stuffing.
  #   - api_zone:   100 req/s sustained, burst 50 — every other API call.
  #                 KKU users browsing the cockpit hit ~10–20 req/page,
  #                 so 100 r/s gives ample headroom for collaborative
  #                 dashboards while still capping a runaway client.
  #   - heavy_zone: 1 req/s sustained, burst 10 — Council Pack export +
  #                 PDF generation. Bursty by nature; let burst cover
  #                 the burst-of-10 page exports during a Council session.
  # `$binary_remote_addr` keys per source IP after real_ip rewrite.
  limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=100r/s;
  limit_req_zone $binary_remote_addr zone=heavy_zone:10m rate=1r/s;
  # When a limit fires, return 429 (default is 503). Easier for clients
  # to back off correctly.
  limit_req_status 429;

  # ── Compression ────────────────────────────────────────────────────
  gzip                on;
  gzip_vary           on;
  gzip_min_length     1024;
  gzip_proxied        any;
  gzip_comp_level     5;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml
    application/x-font-ttf
    font/opentype;

  # ── Default server — block unknown Host headers (444 close) ────────
  # Anyone hitting :8443 with a Host header that isn't ours gets the
  # connection terminated with no response. Defends against vhost
  # fingerprinting and stops slow-loris-style attempts that don't bother
  # setting Host.
  server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    return 444;
  }

  include /etc/nginx/conf.d/*.conf;
}
