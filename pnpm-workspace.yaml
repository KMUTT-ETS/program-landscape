packages:
  - 'apps/*'
  - 'packages/*'

# `pnpm setup` runs `pnpm install` as its first step, so the implicit
# dependency-verification install pnpm runs before every script is
# redundant. It also breaks when the global pnpm and the pinned
# `packageManager` differ in version — pnpm 12 forwards an unknown
# `--verify-deps-before-run-install` flag to pnpm 10 and prints an error.
verifyDepsBeforeRun: false

patchedDependencies:
  next@14.2.32: "patches/next@14.2.32.patch"
