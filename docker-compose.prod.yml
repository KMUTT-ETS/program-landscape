# docker-compose.prod.yml — Program Landscape production stack on a
# single Ubuntu host. Consumed by scripts/deploy.sh on the prod server
# after `docker load` has pulled the image set out of the release
# bundle. See DEPLOYMENT.md for the end-to-end flow.
#
# Conventions:
#   - All images are pinned to ${RELEASE_VERSION}. The deploy script
#     `export`s this from /opt/program-landscape/current/VERSION.
#   - Services that hold persistent data (postgres, redis, minio) use
#     named volumes — never bind mounts.
#   - Only nginx exposes a port to the host. Everything else lives on
#     the internal `kku-internal` bridge.
#   - Every service has a healthcheck. deploy.sh polls them before
#     declaring the release healthy.

name: program-landscape

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: program-landscape-nginx
    restart: unless-stopped
    ports:
      # HTTPS only. KKU's reverse proxy connects here over the internal
      # network. Bind to 0.0.0.0 so the KKU proxy (different host) can
      # reach us; tighten to a KKU-proxy CIDR via UFW rules on the host
      # instead of here.
      - "8443:8443"
      # HTTP on :8080 redirects to HTTPS — optional safety net if the
      # KKU proxy ever mis-sends plain HTTP.
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - kku-internal

  web:
    image: ghcr.io/khon-kaen-university/program-landscape-web:${RELEASE_VERSION}
    container_name: program-landscape-web
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/auth/providers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - kku-internal

  api:
    image: ghcr.io/khon-kaen-university/program-landscape-api:${RELEASE_VERSION}
    container_name: program-landscape-api
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      # /api/v1/ready returns 200 when Postgres + Redis + MinIO +
      # Gotenberg + AI provider key are all present. 503 on any failure.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/ready | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - kku-internal

  ingestion:
    image: ghcr.io/khon-kaen-university/program-landscape-ingestion:${RELEASE_VERSION}
    container_name: program-landscape-ingestion
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/main.js' > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - kku-internal

  postgres:
    image: postgis/postgis:16-3.4
    container_name: program-landscape-postgres
    restart: unless-stopped
    environment:
      # Postgres 16 supports *_FILE for every connection var. The deploy
      # script writes these files from /opt/program-landscape/secrets.
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-program_landscape}
      # Extensions get enabled by the init SQL in infra/postgres/init.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    secrets:
      - postgres_user
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d ${POSTGRES_DB:-program_landscape}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - kku-internal

  redis:
    image: redis:7-alpine
    container_name: program-landscape-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "1gb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kku-internal

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: program-landscape-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    volumes:
      - minio-data:/data
    secrets:
      - minio_user
      - minio_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - kku-internal

  gotenberg:
    image: ghcr.io/khon-kaen-university/program-landscape-gotenberg:${RELEASE_VERSION}
    container_name: program-landscape-gotenberg
    restart: unless-stopped
    environment:
      API_TIMEOUT: "60s"
      LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - kku-internal

networks:
  kku-internal:
    driver: bridge
    # Connectors reach out to the public internet / KKU intranet for
    # data ingestion, so this bridge is NOT `internal: true`.

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nginx-logs:

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  minio_user:
    file: ./secrets/minio_user
  minio_password:
    file: ./secrets/minio_password
