# docker-compose.prod.yml — Program Landscape production stack on a
# single Ubuntu host. Consumed by scripts/deploy.sh on the prod server
# after `docker load` has pulled the image set out of the release
# bundle. See DEPLOYMENT.md for the end-to-end flow.
#
# Conventions:
#   - Our own images are pinned to ${RELEASE_VERSION}. The deploy script
#     `export`s this from /opt/program-landscape/current/VERSION.
#   - Upstream images (nginx, postgis, redis, minio, gotenberg) carry
#     a `tag@sha256:digest` pin. Rotate via scripts/pin-image-digests.sh
#     when the upstream rebuilds — see docs/hardening/07-containers.report.md.
#   - Services that hold persistent data (postgres, redis, minio) use
#     named volumes — never bind mounts.
#   - Only nginx exposes a port to the host. Everything else lives on
#     the internal `kku-internal` bridge.
#   - Every service has a healthcheck. deploy.sh polls them before
#     declaring the release healthy.
#
# Container hardening (prompt 07):
#   - Every service: cap_drop:[ALL], no-new-privileges, mem_limit, cpus,
#     log size cap.
#   - read_only: true on stateless services with explicit tmpfs mounts;
#     postgres + minio keep writable root because their entrypoints
#     mutate config / lock files outside the data volume on first boot.

name: program-landscape

# ──────────────────────────────────────────────────────────────────────
# YAML anchors — common security blocks.
# ──────────────────────────────────────────────────────────────────────
x-common-security: &common-security
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.27-alpine@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
    container_name: program-landscape-nginx
    restart: unless-stopped
    ports:
      # HTTPS only. KKU's reverse proxy connects here over the internal
      # network. Bind to 0.0.0.0 so the KKU proxy (different host) can
      # reach us; tighten to a KKU-proxy CIDR via UFW rules on the host
      # instead of here.
      - "8443:8443"
      # HTTP on :8080 redirects to HTTPS — optional safety net if the
      # KKU proxy ever mis-sends plain HTTP.
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    # nginx writes the master pid file + cache + worker temp dirs at
    # runtime. With read_only:true these have to land on tmpfs.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "--header=Host: program-landscape.kku.ac.th", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *common-logging
    networks:
      - kku-internal

  web:
    image: ghcr.io/khon-kaen-university/program-landscape-web:${RELEASE_VERSION}
    container_name: program-landscape-web
    restart: unless-stopped
    env_file: .env.prod
    # Next.js writes telemetry / build-trace lookups to /tmp during dev;
    # in prod standalone it ALSO writes incremental cache files to
    # `.next/cache/` at runtime — without a writable tmpfs at that
    # exact path, every cache write fails ENOENT (verified 2026-05-09).
    # /tmp is older safety net.
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    user: "1001:1001"   # matches `app` user in apps/web/Dockerfile.prod
    <<: *common-security
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/auth/providers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging: *common-logging
    networks:
      - kku-internal

  api:
    image: ghcr.io/khon-kaen-university/program-landscape-api:${RELEASE_VERSION}
    container_name: program-landscape-api
    restart: unless-stopped
    env_file: .env.prod
    # Multer streams multipart uploads into /tmp by default; pino /
    # nestjs-pino don't write files. /tmp on tmpfs handles the upload
    # buffer in memory (capped by tmpfs default size).
    read_only: true
    tmpfs:
      - /tmp:size=200M
    user: "1001:1001"   # matches `app` user in apps/api/Dockerfile.prod
    <<: *common-security
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      # LIVENESS only — `/healthz` checks that the api process is
      # responsive. Compose uses this to decide whether to RESTART the
      # container; a transient Postgres / Gotenberg blip should NOT
      # restart the api (defeats the circuit breaker from prompt 11).
      # The READINESS check at `/api/v1/ready` is for nginx + the KKU
      # upstream proxy — they gate TRAFFIC on it, which is the right
      # level for "deps are slow / draining" flags.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:4000/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging: *common-logging
    networks:
      - kku-internal

  ingestion:
    image: ghcr.io/khon-kaen-university/program-landscape-ingestion:${RELEASE_VERSION}
    container_name: program-landscape-ingestion
    restart: unless-stopped
    env_file: .env.prod
    # BullMQ workers use /tmp for AI-prompt scratch + PDF buffer space.
    # 500M tmpfs accommodates a 50 MB-PDF intake job + headroom.
    read_only: true
    tmpfs:
      - /tmp:size=500M
    # Persist pipeline child-process logs on the host so operators can
    # `tail -f` them without docker exec. Bind-target was created in the
    # Dockerfile with the right ownership; the host dir must be chowned
    # to UID 1010 by deploy.sh on first run (or manually).
    volumes:
      - /opt/program-landscape/logs:/app/logs
    user: "1010:1010"   # matches `app` user in apps/ingestion/Dockerfile.prod
    <<: *common-security
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/main.js' > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
    logging: *common-logging
    networks:
      - kku-internal

  postgres:
    # Custom-built image (infra/postgres/Dockerfile) — postgis + pgvector
    # + pg_trgm + btree_gin. Upstream postgis/postgis:16-3.4 lacks
    # pgvector and silently breaks every vector-column CREATE TABLE
    # during pg_restore. Verified prod 2026-05-10. Built via build-release.ts.
    image: ghcr.io/khon-kaen-university/program-landscape-postgres:${RELEASE_VERSION}
    container_name: program-landscape-postgres
    restart: unless-stopped
    # Postgres parallel-query workers map hash-join state into /dev/shm.
    # The 64 MB Docker default blows up on the per-teacher CTE in the
    # /staff/teaching-workload endpoints (joins 122k class_offerings ×
    # 215k class_offering_teachers). Bump to 1 GB — mirrors the same
    # change shipped in docker-compose.yml (dev). Verified prod 2026-05-16:
    # the per-teacher drill-down 500'd until this landed.
    shm_size: 1g
    # max_connections — 100 (Postgres default) is too tight. Long-lived
    # containers each run a Prisma client with a per-process pool of
    # ~17: api + ingestion + web = ~51 baseline. Ingestion can burst
    # to 4-5 concurrent connector runs, and /dashboards/executive-landscape
    # fans 10+ parallel queries from one request. Default 100 saturated
    # on dev 2026-05-18 ("too many clients already"); 300 gives ~6×
    # headroom and is well within Postgres' comfort zone for the 4 GB
    # container budget. shared_buffers stays at the default-relative
    # 256 MB — we have a 4 GB memory limit, can revisit if a workload
    # benchmarks bottlenecked on cache.
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    environment:
      # Postgres 16 supports *_FILE for every connection var. The deploy
      # script writes these files from /opt/program-landscape/secrets.
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-program_landscape}
      # Extensions get enabled by the init SQL in infra/postgres/init.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # postgres entrypoint runs as root briefly to chown the data dir,
    # then drops privileges via gosu. Read-only root would block the
    # chown step on first boot. Capability drop + no-new-privileges
    # apply regardless — the running postgres process is unprivileged.
    # Verify in prod with `docker exec program-landscape-postgres ps -u postgres`.
    secrets:
      - postgres_user
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d ${POSTGRES_DB:-program_landscape}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging: *common-logging
    networks:
      - kku-internal

  redis:
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    container_name: program-landscape-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "1gb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp
    user: "redis:redis"
    <<: *common-security
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "0.5"
    logging: *common-logging
    networks:
      - kku-internal

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    platform: linux/amd64
    container_name: program-landscape-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    volumes:
      - minio-data:/data
    # MinIO writes its server config under $HOME/.minio at startup
    # (read root-creds from secret files first). Read-only root would
    # block that. Capability drop still applies; the server runs as
    # the unprivileged `minio` user inside the container.
    <<: *common-security
    secrets:
      - minio_user
      - minio_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    logging: *common-logging
    networks:
      - kku-internal

  gotenberg:
    image: ghcr.io/khon-kaen-university/program-landscape-gotenberg:${RELEASE_VERSION}
    container_name: program-landscape-gotenberg
    restart: unless-stopped
    environment:
      API_TIMEOUT: "60s"
      LOG_LEVEL: "info"
    # Headless Chromium spawns scratch dirs under /tmp during PDF
    # rendering. 1G tmpfs is generous; Council Pack rendering peaks at
    # ~200 MB simultaneous spawns.
    read_only: true
    tmpfs:
      - /tmp:size=1G
    <<: *common-security
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
    logging: *common-logging
    networks:
      - kku-internal

networks:
  kku-internal:
    driver: bridge
    # Connectors reach out to the public internet / KKU intranet for
    # data ingestion, so this bridge is NOT `internal: true`.

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nginx-logs:

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  minio_user:
    file: ./secrets/minio_user
  minio_password:
    file: ./secrets/minio_password
