name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, fast pre-flight gate. Fails the PR before the heavy
  # lint-typecheck-test job spins up Postgres if a migration carries
  # destructive DDL without an explicit allow-annotation.
  migration-linter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies (root only)
        run: pnpm install --frozen-lockfile
      - name: Lint migrations for destructive DDL
        run: pnpm tsx scripts/migration-linter.ts

  # The Scholar merge is additive-only: nothing may ever remove a
  # ResearchOutput row. That invariant used to be described in a comment and
  # "enforced" by whoever remembered to run the grep — which is to say, not
  # enforced. A row removal here silently destroys a researcher's publication
  # library on any bad scrape, so it gets a build gate like the migration
  # linter next door.
  #
  # Grep, not a lint rule: the property is "this file contains no removal
  # call at all", which is exactly what a text search answers and exactly
  # what a rule with an escape hatch would not. If a removal is ever
  # genuinely needed, deleting this job is the conversation.
  scholar-no-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      # Both @kku/db modules that touch ResearchOutput for this feature, not
      # just the writer. scholar-console.ts only READS today — but it is a
      # second module in the same feature holding a Prisma client and a list
      # of facultyMemberIds, and the point of a guard is to notice the day
      # that stops being true.
      - name: Scholar modules must contain no row-removal call
        run: |
          failed=0
          for f in packages/db/src/scholar-fetch.ts packages/db/src/scholar-console.ts; do
            if grep -nE "delete|deleteMany" "$f"; then
              echo "::error file=$f::The Scholar modules are additive-only — they must never remove a ResearchOutput row. See the scholar-fetch.ts module header."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "OK: no row-removal call in the Scholar modules."

  # Secret scan. Sits beside the migration linter as a second cheap pre-flight
  # gate — a credential is far more expensive to deal with once it is in
  # history than once it is in a diff.
  #
  # Scoped to the changed set, matching how the lint job scopes to changed
  # files: a PR is judged on its own diff. The repo's history was audited
  # clean on 2026-08-27; a full-history scan is a separate, deliberate
  # exercise, not something to run on every push.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan can resolve the diff range below.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan changed commits for secrets
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
          fi
          if [ -z "${BASE}" ]; then
            echo "No base commit to diff against — scanning the working tree instead."
            gitleaks dir . --redact --no-banner --config .gitleaks.toml
            exit 0
          fi
          echo "Secret-scan range: ${BASE}..HEAD"
          gitleaks git . \
            --redact \
            --no-banner \
            --config .gitleaks.toml \
            --log-opts "${BASE}..HEAD"

  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kku
          POSTGRES_PASSWORD: kku
          POSTGRES_DB: kku_landscape
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U kku -d kku_landscape"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the lint step can diff against the PR base /
          # previous commit to find changed files.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link env fallback
        run: |
          cp .env.example .env
          node scripts/link-env.mjs

      # Lint only the TS/TSX files this PR (or push) actually changed, rather
      # than the whole repo. The repo carries a pre-existing ESLint backlog in
      # files unrelated to any given change; linting everything turns every PR
      # red on debt it didn't introduce. Scoping to changed files keeps CI
      # honest — a PR is judged on its own diff — while still catching new
      # violations (and any pre-existing errors in a file you touch, which is a
      # fair boy-scout nudge). Run `pnpm lint` locally for the full-repo view.
      - name: Lint (changed files only)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            RANGE="${BASE}...HEAD"
          else
            BASE="${{ github.event.before }}"
            if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
            RANGE="${BASE:+${BASE} }HEAD"
          fi
          echo "Lint diff range: ${RANGE}"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR ${RANGE} \
            | grep -E '^(apps|packages)/.*\.(ts|tsx)$' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TS/TSX files under apps/ or packages/ — skipping lint."
            exit 0
          fi
          echo "Linting ${#FILES[@]} changed file(s):"
          printf '  %s\n' "${FILES[@]}"
          pnpm exec eslint "${FILES[@]}"

      # Prisma client must be generated before Typecheck — tsc resolves
      # `@prisma/client` types from the generated client, and many modules
      # import Prisma enums/types directly. (This previously sat after
      # Typecheck; the ordering bug was masked because CI always failed at the
      # whole-repo Lint step first and never reached Typecheck.)
      - name: Prisma generate
        run: pnpm --filter @kku/db exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      # The CI Postgres service runs postgis/postgis:16-3.4, which ships
      # PostGIS but NOT pgvector. The init migration does `CREATE EXTENSION
      # vector`, so install pgvector into the running service container before
      # migrating. Dev/prod use our custom postgres image (infra/postgres) that
      # bakes pgvector in; a GitHub `services:` block can't `build:` an image,
      # so we apt-install it here instead. The image is PGDG-based, so the
      # package is available. No server restart needed — CREATE EXTENSION loads
      # it on demand once vector.control + the .so are on disk.
      - name: Install pgvector into the Postgres service
        run: |
          set -euo pipefail
          # apt-get update can pull a newer postgres-16 minor, which replaces
          # the contrib .so files (pg_trgm, etc.) on disk while the *running*
          # server is still the old binary — loading the new pg_trgm.so then
          # fails with "undefined symbol". Restart the container after install
          # so the running server matches the upgraded libraries, then wait for
          # it to accept connections again.
          docker exec ${{ job.services.postgres.id }} bash -c \
            "apt-get update && apt-get install -y postgresql-16-pgvector"
          docker restart ${{ job.services.postgres.id }}
          echo "Waiting for Postgres to accept connections after restart…"
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} pg_isready -U kku -d kku_landscape >/dev/null 2>&1; then
              echo "Postgres ready"; break
            fi
            sleep 2
            if [ "$i" -eq 30 ]; then echo "Postgres did not become ready"; exit 1; fi
          done

      - name: Apply migrations (test DB)
        env:
          DATABASE_URL: postgresql://kku:kku@localhost:5432/kku_landscape?schema=public
        run: pnpm --filter @kku/db exec prisma migrate deploy

      - name: Seed (test DB)
        env:
          DATABASE_URL: postgresql://kku:kku@localhost:5432/kku_landscape?schema=public
          NODE_ENV: test
        run: pnpm --filter @kku/db seed

      # Runs immediately after the seed on purpose. prisma/seed.ts writes both
      # `status` and `mocked` from SOURCE_CATALOG, so this asserts the seed
      # produced a state realDataWhere() can actually see. A connector left
      # `mocked: true` in the catalog after being flipped real silently hides
      # every row it ever loaded — that regression went unnoticed for over a
      # month and surfaced only as a blank health-radar dimension.
      - name: Data-sources flag audit
        env:
          DATABASE_URL: postgresql://kku:kku@localhost:5432/kku_landscape?schema=public
        run: pnpm data-sources:audit

      - name: Test
        env:
          DATABASE_URL: postgresql://kku:kku@localhost:5432/kku_landscape?schema=public
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test-secret-please-override-for-anything-real
          AI_PROVIDER: stub
        run: pnpm test

      - name: AI eval (offline safety-gate coverage)
        run: pnpm ai:eval
